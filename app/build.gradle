plugins {
    id 'com.android.application'
}

def placesApiKey = project.findProperty('PLACES_API_KEY') ?: System.getenv('PLACES_API_KEY') ?: 'NO_KEY'
def releaseKeystorePath = System.getenv('ANDROID_KEYSTORE_PATH')
def releaseKeystorePassword = System.getenv('ANDROID_KEYSTORE_PASSWORD')
def releaseKeyAlias = System.getenv('ANDROID_KEY_ALIAS')
def releaseKeyPassword = System.getenv('ANDROID_KEY_PASSWORD')
def releaseSigningReady = [releaseKeystorePath, releaseKeystorePassword, releaseKeyAlias, releaseKeyPassword].every { it != null && !it.trim().isEmpty() }

android {
    namespace 'com.mrone.fieldapp'
    compileSdk 35

    defaultConfig {
        applicationId 'com.mrone.fieldapp'
        minSdk 28
        targetSdk 34
        versionCode 144
        versionName '1.4.4'
        manifestPlaceholders = [PLACES_API_KEY: placesApiKey]
    }

    signingConfigs {
        release {
            if (releaseSigningReady) {
                storeFile file(releaseKeystorePath)
                storePassword releaseKeystorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (releaseSigningReady) signingConfig signingConfigs.release
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}


dependencies {
    implementation 'com.google.android.libraries.places:places:5.3.0'
    implementation 'com.google.android.material:material:1.12.0'
}
