name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout project
        uses: actions/checkout@v6

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Verify stable signing secrets
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is missing. Run the one-time FAST-UPDATE signing setup before building v1.4.4+."
              exit 1
            fi
          done

      - name: Decode release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/mr-one-release.jks"
          test -s "$RUNNER_TEMP/mr-one-release.jks"

      - name: Build signed release APK
        env:
          PLACES_API_KEY: ${{ secrets.PLACES_API_KEY }}
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/mr-one-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace -PPLACES_API_KEY="${PLACES_API_KEY:-NO_KEY}" clean assembleRelease

      - name: Prepare versioned APK
        id: meta
        shell: bash
        run: |
          VERSION="$(sed -n "s/.*versionName[[:space:]]*['"]\([^'"]*\)['"].*/\1/p" app/build.gradle | head -1)"
          if [ -z "$VERSION" ]; then
            echo "::error::Could not read versionName"
            exit 1
          fi
          APK="MR-One-v${VERSION}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$APK"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "apk=$APK" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: MR-One-v${{ steps.meta.outputs.version }}-APK
          path: ${{ steps.meta.outputs.apk }}
          if-no-files-found: error

      - name: Publish direct-update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.meta.outputs.version }}
          APK: ${{ steps.meta.outputs.apk }}
        run: |
          TAG="v${VERSION}"
          NOTES="CHANGELOG-v${VERSION}.md"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" --clobber
          elif [ -f "$NOTES" ]; then
            gh release create "$TAG" "$APK" --title "MR One v${VERSION}" --notes-file "$NOTES"
          else
            gh release create "$TAG" "$APK" --title "MR One v${VERSION}" --notes "MR One v${VERSION}"
          fi
